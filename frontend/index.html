<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image" href="/Aesthesia-Haven-light.webp" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="google-site-verification"
      content="3nMV20e5vX6w-MKJI8A3HAWFD-9-gXkQqzGbxSpVvsI"
    />
    <meta name="robots" content="index, follow" />

    <meta
      property="og:title"
      content="Aesthesia Haven | Embrace Your Beautiful"
    />
    <meta
      property="og:description"
      content="Aesthesia- Where women see themselves again"
    />
    <meta
      property="og:image"
      content="https://res.cloudinary.com/dqbf9abcg/image/upload/v1764289759/sbxp7g2huimqcrrb1nrd.webp"
    />
    <meta property="og:url" content="https://www.aesthesiahaven.com" />
    <title>Aesthesia Haven</title>

    <!-- Performance optimizations -->
    <link
      rel="preload"
      href="/fonts/Outfit-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!--
      Preconnect: open TCP+TLS tunnel early for origins used on first render.
      Limit to ≤4 to avoid wasting browser connection slots.
    -->
    <!-- Backend API — first data fetch (products + sections). Est. 290ms LCP savings -->
    <link rel="preconnect" href="https://aesthesia-store-backend.onrender.com" crossorigin />
    <link rel="dns-prefetch" href="https://aesthesia-store-backend.onrender.com" />
    <!-- Cloudinary — product images load immediately on homepage -->
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />

    <!--
      dns-prefetch only (fires after JS loads, not on first paint):
      - connect.facebook.net: Facebook Pixel loads via react-facebook-pixel after hydration
      - api.currencyapi.com: 30-day localStorage cache means rarely fires on repeat visits
      - js.paystack.co: lazy-loaded on /place-order page only
    -->
    <link rel="dns-prefetch" href="https://connect.facebook.net" />
    <link rel="dns-prefetch" href="https://api.currencyapi.com" />
    <link rel="dns-prefetch" href="https://js.paystack.co" />
    <!-- <link rel="preload" as="image" href="./src/assets/bg-main-4.webp" /> -->

    <!-- Paystack inline.js is now dynamically loaded only on the /place-order page -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
